data_cfg:
  dataset_name: CCPG
  dataset_root: /root/lanyun-tmp/Data/CCPG-link
  dataset_partition: ./datasets/CCPG/CCPG.json
  num_workers: 1
  data_in_use: [True, True] 
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: CCPG

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 120000
  save_name: PAGait # LowLevel
  eval_func: evaluate_CCPG
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseParsingCuttingTransform
 

loss_cfg:
  - loss_term_weights: 1.0
    margin: 0.3
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weights: 0.3
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: PAGait
  RAMLayersP:
      reduction: 16        # 通道缩减系数（用于FC层降维，常见取值8/16，16更常用）
      with_max_pool: True  # 是否在池化时结合最大池化（True：avg_pool+max_pool，False：仅avg_pool）
  Backbone:
    in_channels: 3
    blocks:
      - 1
      - 1
      - 1
      - 1
    C: 2
  SeparateBNNecks:
    class_num: 100

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 40000
    - 80000
    - 100000
  scheduler: MultiStepLR

trainer_cfg:
  with_test: true 
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  log_iter: 100
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 10000
  save_name: PAGait # LowLevel
  sync_BN: true
  total_iter: 120000
  sampler:
    batch_shuffle: true
    batch_size:
      - 32 # TripletSampler, batch_size[0] indicates Number of Identity
      - 2  #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_fixed: 30 # fixed frames number for training
    frames_skip_num: 4
    sample_type: fixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseParsingCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.1


